name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: FramedBlocks-${{ github.ref_name }}
          path: build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: FramedBlocks-${{ github.ref_name }}
          path: artifacts

      - name: Delete old releases for this Minecraft version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag format: v<mc>-<version> (e.g. v1.20.1-1.0.1) -> extract <mc>
          MC="${GITHUB_REF_NAME#v}"
          MC="${MC%%-*}"
          for r in $(gh release list --json tagName --jq '.[].tagName'); do
            case "$r" in
              "v${MC}-"*)
                if [ "$r" != "$GITHUB_REF_NAME" ]; then
                  echo "Deleting old release $r"
                  gh release delete "$r" --yes
                fi
                ;;
            esac
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
